<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow-lg" style="width: 500px;">
            <div class="card-body">
                <h4 class="text-center">Create New Quiz</h4>
                <form action="/add/quiz" method="POST">
                    <div class="mb-3">
                        <label for="chapter_id" class="form-label">Chapter ID:</label>
                        <select class="form-control" id="chapter_id" name="chapter_id" required>
                            {% for chapter in chapters %}
                                <option value="{{ chapter.id }}">{{ chapter.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="date_of_quiz" class="form-label">Date of Quiz:</label>
                        <input type="datetime-local" class="form-control" id="date_of_quiz" name="date_of_quiz" required>
                    </div>
                    <div class="mb-3">
                        <label for="time_duration" class="form-label">Time Duration (Minutes):</label>
                        <input type="number" class="form-control" id="time_duration" name="time_duration" required>
                    </div>
                    <div class="mb-3">
                        <label for="remarks" class="form-label">Remarks:</label>
                        <textarea class="form-control" id="remarks" name="remarks" rows="3"></textarea>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Create Quiz</button>
                    </div>
                </form>
                <br>
                <p>don't want to add new quiz? <a href="/quiz">Go Back</a></p>
            </div>
        </div>
    </div>
</body>
</html>
