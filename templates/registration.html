<!DOCTYPE html>
<html>
<head>
    <title>Registration page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">  
    <style>
        #form-body{
            height: 337px;
        }
    </style>
</head>
<body>
    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow-lg" style="width: 500px;">
            <div class="card-body">
                <form action="/register" method="post" >
                <div style="text-align: center;">
                    <h5 text-align= 'center'>Welcome to Quiz Master</h5>
                    <h5 text-align = 'center'>registration</h5>
                </div>
                <div class="mb-3" style="text-align: center;">
                    <label for="Input1" class="form-label">Username</label>
                    <input type="text" class="form-control" id="Input1" name="username" required>
                </div>
                <div class="mb-3" style="text-align: center;">
                    <label for="Input2" class="form-label">E-mail</label>
                    <input type="text" class="form-control" id="Input2" name="email" required>
                </div>
                <div class="mb-3" style="text-align: center;">
                    <label for="Input3" class="form-label">Fullname</label>
                    <input type="text" class="form-control" id="Input3" name="fullname" required>
                </div>
                <div class="mb-3" style="text-align: center;">
                    <label for="Input4" class="form-label">Gander</label>
                    <select id="gender" name="gender" required>
                        <option value="" disabled selected>Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="mb-3" style="text-align: center;">
                    <label for="Input5" class="form-label">Password</label>
                    <input type="password" class="form-control" id="Input5" name="password" required>
                </div>
                <div style="text-align: center;">
                <input type="submit" class="btn btn-primary" value="Register"> <br>
                Already registered? <a href="/">login</a>
               </div>
               </form>
            </div>
        </div>
    </div>
</body>
</html>
