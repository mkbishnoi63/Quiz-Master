<!DOCTYPE html>
<html lang="en">
<head>
    <title>View Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .quiz-container {
            max-width: 500px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        .form-label {
            font-weight: bold;
        }
        .form-control {
            background-color: #f4f4f4;
        }
        .close-btn {
            display: block;
            width: 100%;
            text-align: center;
            padding: 10px;
            background-color: #94da70;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }
        .close-btn:hover {
            background-color: #98c75b;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h3 class="text-center mb-4">Quiz Details</h3>

        <div class="mb-3">
            <label class="form-label">Quiz ID:</label>
            <input type="number" class="form-control" value="{{ quiz.id }}" readonly>
        </div>
        <div class="mb-3">
            <label class="form-label">Subject:</label>
            <input type="text" class="form-control" value="{{ quiz.chapter.subject.name }}" readonly>
        </div>
        <div class="mb-3">
            <label class="form-label">Chapter:</label>
            <input type="text" class="form-control" value="{{ quiz.chapter.name }}" readonly>
        </div>
        <div class="mb-3">
            <label class="form-label">Duration:</label>
            <input type="text" class="form-control" value="{{ '{:02d}:{:02d}'.format(quiz.time_duration // 60, quiz.time_duration % 60) }}" readonly>
        </div>
        <div class="mb-4">
            <label class="form-label">Scheduled Date:</label>
            <input type="date" class="form-control" value="{{ quiz.date_of_quiz.strftime('%Y-%m-%d') }}" readonly>
        </div>
        <a href="/user_dash" class="close-btn">Close</a>
    </div> 
</body>
</html>
