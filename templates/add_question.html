<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Question</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex justify-content-center align-items-center vh-70">
        <div class="card shadow-lg" style="width: 600px;">
            <div class="card-body">
                <h4 class="text-center">Add New Question</h4>
                <form action="/add/question/{{quiz.id}}" method="POST">
                    <div class="mb-3">
                        <label for="quiz_id" class="form-label">Quiz ID:</label>
                        <input type="number" class="form-control" id="quiz_id" name="quiz_id" value="{{quiz.id}}">
                    </div>
                    <div class="mb-3">
                        <label for="question_text" class="form-label">Question:</label>
                        <textarea class="form-control" id="question_text" name="question_text" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Options:</label>
                        <input type="text" class="form-control mb-2" name="option_1" placeholder="Option 1" required>
                        <input type="text" class="form-control mb-2" name="option_2" placeholder="Option 2" required>
                        <input type="text" class="form-control mb-2" name="option_3" placeholder="Option 3" required>
                        <input type="text" class="form-control mb-2" name="option_4" placeholder="Option 4" required>
                    </div>
                    <div class="mb-3">
                        <label for="correct_option" class="form-label">Correct Option (1-4):</label>
                        <input type="number" class="form-control" id="correct_option" name="correct_option" min="1" max="4" required>
                    </div>
                    <div class="mb-3">
                        <label for="marks" class="form-label">Marks:</label>
                        <input type="number" class="form-control" id="marks" name="marks" value="1" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Add Question</button>
                    </div>
                </form>
                <br>
                <p>don't want to add question? <a href="/quiz">Go Back</a></p>
            </div>
        </div>
    </div>
</body>
</html>
