<!DOCTYPE html>
<html>
<head>
    <title>Summary Charts</title>
    <link rel="stylesheet" href="static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">  
</head>
<body>
    <div class="navbar">
        <div class="nav-links">
            <a href="/user_dash">Home</a> | 
            <a href="/score">Scores</a> | 
            <a href="/summary">Summary</a> | 
            <a href="/logout">Logout</a>
        </div>

        <div class="right-section">
            <form action="/user_search" method="GET" style="display: flex;">
                <input type="text" name="query" placeholder="chapter, quiz or score" value="{{ search_query }}">
                <input type="hidden" name="username" value="{{ username }}">
                <button type="submit" class="btn btn-primary">Search</button>
            </form>
            <strong>Welcome {{ username }}</strong>
        </div>
    </div>

    <div class="container mt-5 text-center">
        {% if message %}
            <h3 class="text-danger">{{ message }}</h3>
        {% elif image %}
            <h3>Subject wise quizzes attempted</h3>
            <img src="{{ image }}" alt="Quiz Summary Chart" class="img-fluid mt-4">
        {% endif %}
    </div>
    
</body>
</html>
