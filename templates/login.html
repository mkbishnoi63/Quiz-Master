<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">  
    <style>
        #form-body{
            height: 337px;
        }
        .quiz-master-header {
            text-align: center;
            font-size: 3rem;
            font-weight: bold;
            color: white;
            padding: 40px;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
        }
    </style>
</head>
<body>
    <div class="quiz-master-header">
        <h1>Quiz Master</h1>
    </div>    
    <div id="main">
        <div id = "canvas">
            <div id="form-body" style = "height: 650px; width: 500px; margin-top: 80px;" class="container">
                <form action="/" method="post" >
                <div style="text-align: center;">
                    <h5 text-align= 'center'>Welcome to Quiz Master</h5>
                    <h5 text-align = 'center'>Login</h5>
                </div>
                <div class="mb-3" style="text-align: center;">
                    <label for="Input1" class="form-label" >Username</label>
                    <input type="text" class="form-control" id="Input1" name="username" required>
                </div>
                <div class="mb-3" style="text-align: center;">
                    <label for="Input2" class="form-label">Password</label>
                    <input type="password" class="form-control" id="Input2" name="password" required>
                </div>
                <div style="text-align: center;">
                <input type="submit" class="btn btn-primary" value="Login"> <br>
                Are you a new user? <a href="/register">Register</a>
               </div>
               </form>
            </div>
        </div>
    </div>
</body>
</html>
